    <title>Game Challenge</title>

    <style>

        body {
            margin: 0;
            font-family: Arial,sans-serif;
            background: #edf1f5;
        }


        .header {
            background: #263238;
            color: white;
            padding: 20px;
            text-align: right;
            font-size: 22px;
        }


        .container {
            max-width: 800px;
            margin: auto;
            padding: 25px;
        }

        .linea {
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 10px;
            margin: 20px 0;
        }


        .posizione {
            min-height: 80px;
            background: #95a5a6;
            color: white;
        }


        .tessere {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        .tessera {
            background: #f1c40f;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px #0003;
        }


        button {
            border: none;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            font-size: 16px;
        }


        .unlock {
            width: 100%;
            background: #27ae60;
            color: white;
            font-size: 20px;
        }


        .play {
            width: 100%;
            background: #3498db;
            color: white;
        }


        .categorie {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }


        .categoria {
            padding: 20px;
            border-radius: 18px;
            color: white;
        }


            .categoria h2 {
                margin: 0 0 10px;
            }


        .grigia {
            background: #7f8c8d;
        }


        .rossa {
            background: #e74c3c;
        }


        .gialla {
            background: #f1c40f;
            color: #333;
        }


        .verde {
            background: #27ae60;
        }


        .categoria button {
            margin-top: 15px;
            width: 100%;
            background: white;
            color: #333;
        }


        .bloccato {
            opacity: .7;
            cursor: not-allowed;
        }



        .contenitori {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .contenitore {
            background: #3498db;
            color: white;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }


            .contenitore:hover {
                transform: scale(1.05);
            }


        .piastrina {
            background: #f1c40f;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin: 30px 0;
        }
        .menu-button {
            width: 100%;
            margin-top: 20px;
            background: #34495e;
            color: white;
        }


            .menu-button:hover {
                background: #2c3e50;
            }
        .abbinamenti {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .bottone-extra {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 18px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }


            .bottone-extra:hover {
                transform: scale(1.05);
            }

        .riga-indovina {
            display: flex;
            align-items: center;
            gap: 10px;
        }



        .descrizione {
            flex: 1;
            background: #eee;
            padding: 8px;
            border-radius: 10px;
            font-size: 14px;
        }



        .spazio-personaggio {
            width: 120px;
            min-height: 40px;
            font-size: 13px;
            border-radius: 10px;
        }



        .tessere-piccole {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }



            .tessere-piccole .tessera {
                padding: 8px 12px;
                font-size: 13px;
                min-width: 90px;
            }
        .cruciverba {
            display: grid;
            grid-template-columns: repeat(15,38px);
            gap: 1px;
            justify-content: center;
            margin: 20px auto;
        }



        .cella {
            width: 38px;
            height: 38px;
            border: 1px solid #555;
            background: white;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0;
        }



            .cella:focus {
                outline: 3px solid #3498db;
                background: #e8f4ff;
            }



        .nera {
            width: 38px;
            height: 38px;
            background: #333;
        }


        .cella.parola {
            background: #bfe8ff;
        }


        .cella.selezionata {
            background: #4da6ff;
        }
        .cella {
            position: relative;
        }


        .cerchio-blu::after {
            content: "";
            position: absolute;
            width: 32px;
            height: 32px;
            border: 3px solid blue;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .numero {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 10px;
            font-weight: bold;
        }
        .lettera {
            font-size: 22px;
        }
        .domande {
            text-align: left;
            font-size: 14px;
        }
        .cella.errore {
            color: red;
            font-weight: bold;
        }
        .contenitore-domande {
            display: flex;
            gap: 20px;
            width: 100%;
        }


        .domande-colonna {
            flex: 1;
            min-width: 0;
        }


        .lista-domande {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }


            .lista-domande p {
                margin: 8px 0;
            }
        .speciale {
            margin: 25px auto;
            width: 90%;
            max-width: 500px;
            background: linear-gradient(135deg, #1565c0, #42a5f5);
            color: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }


            .speciale h2 {
                margin-top: 0;
                font-size: 26px;
            }


            .speciale p {
                font-size: 18px;
                margin: 15px 0;

            .speciale .unlock {
                background: gold;
                color: black;
                border: none;
                border-radius: 15px;
                padding: 15px 30px;
                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
            }



                .speciale .unlock:hover {
                    transform: scale(1.05);
                }



            .speciale .play {
                background: white;

                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
            }



                .speciale .play:hover {
                    transform: scale(1.05);
                }

        function avvioGiocatore() {

            let nomeInserito = prompt("Inserisci il tuo nome");


            if (!nomeInserito) {

                nomeInserito = "Giocatore";

            }


            let datiSalvati = localStorage.getItem(
                "giocatore_" + nomeInserito
            );


            if (datiSalvati) {

                // recupera i dati esistenti

                salvataggio = JSON.parse(datiSalvati);

                console.log("Caricato giocatore:", salvataggio.nome);


            }
            else {

                // nuovo giocatore

                salvataggio.nome = nomeInserito;


                salvataggio.monete = 1000;

                salvataggio.prossimo = 0;

                salvataggio.contenutoSpecialeSbloccato = 0;

                salvataggio.crucicorretto = 0;


                console.log("Creato nuovo giocatore:", nomeInserito);


                salvaGiocatore();

            }


            // aggiorna le variabili che usa già il gioco

            monete = salvataggio.monete;

            prossimo = salvataggio.prossimo;

            contenutoSpecialeSbloccato =
                salvataggio.contenutoSpecialeSbloccato;

            crucicorretto =
                salvataggio.crucicorretto;
            giochi = salvataggio.giochi;
            record = salvataggio.record;
            recordAvanti = salvataggio.recordAvanti;
            recordIndovina = salvataggio.recordIndovina;
            recordTempo = salvataggio.recordTempo;
            giocato = salvataggio.giocato;
            giocatoAvanti = salvataggio.giocatoAvanti;
            giocatoIndovina = salvataggio.giocatoIndovina;
            giocatoTempo = salvataggio.giocatoTempo
            partitaCruciverbone = salvataggio.partitaCruciverbone

        function stato(tipo) {


            let valore = record[tipo];

            let massimo = smistamento[tipo].premio;



            if (!giocato[tipo])

                return "grigia";


            if (valore === 0)

                return "rossa";


            if (valore < massimo)

                return "gialla";


            return "verde";


        }

        function rispostaSmistamento(risposta) {


            let corretta =

                partitaSmistamento.domande[
                partitaSmistamento.numero
                ][1];



            if (risposta === corretta) {

                partitaSmistamento.corrette++;

            }



            partitaSmistamento.numero++;



            if (partitaSmistamento.numero === 10) {


                fineSmistamento();


            }

            else {


                mostraDomandaSmistamento();


            }


        }







        function fineSmistamento() {



            let dati = smistamento[partitaSmistamento.tipo];



            let premio = Math.floor(

                (partitaSmistamento.corrette / 10) * dati.premio

            );



            let vecchio = record[partitaSmistamento.tipo];


            let extra = premio - vecchio;



            if (extra > 0) {


                monete += extra;
               

                record[partitaSmistamento.tipo] = premio;
               


            }



            giocato[partitaSmistamento.tipo] = true;
            salvataggio.monete = monete
            salvataggio.giochi = giochi
            salvataggio.record = record
            salvataggio.giocato=giocato
            salvaGiocatore();

                    c.classList.remove("parola");

                    c.classList.remove("selezionata");


                });



            let r = cellaSelezionata.r;

            let c = cellaSelezionata.c;



            if (direzioneCruciverbone === "orizzontale") {



                // vado a sinistra fino all'inizio

                while (

                    c > 0 &&

                    cruciverbone.soluzione[r][c - 1] !== "#"

                ) {

                    c--;

                }




                while (

                    c < cruciverbone.soluzione[0].length &&

                    cruciverbone.soluzione[r][c] !== "#"

                ) {



                    document.getElementById(

                        "cella-" + r + "-" + c

                    ).classList.add("parola");



                    c++;


                }



            }



            else {



                // vado sopra fino all'inizio

                while (

                    r > 0 &&

                    cruciverbone.soluzione[r - 1][c] !== "#"

                ) {

                    r--;

                }




                while (

                    r < cruciverbone.soluzione.length &&

                    cruciverbone.soluzione[r][c] !== "#"

                ) {



                    document.getElementById(

                        "cella-" + r + "-" + c

                    ).classList.add("parola");



                    r++;


                }


            }





            document.getElementById(

                "cella-" + cellaSelezionata.r + "-" + cellaSelezionata.c

            ).classList.add("selezionata");



        }


        function confermaCruciverbone() {


            let errori = 0;



            for (let i = 0; i < cruciverbone.soluzione.length; i++) {


                for (let j = 0; j < cruciverbone.soluzione[i].length; j++) {



                    let soluzione =

                        cruciverbone.soluzione[i][j];



                    if (soluzione !== "#") {



                        let inserita =

                            partitaCruciverbone.griglia[i][j];



                        if (inserita !== soluzione) {


                            errori++;


                        }



                    }



                }


            }

        
            if (errori === 0) {

                
                alert("✅ Cruciverbone corretto! Controlla le caselle blu per scoprire il tuo regalo, poi torna al menu per sbloccare contenuti extra...");
                
                mostraBottoneExtra();
                mostraCerchiBlu();
                crucicorretto = 1
                salvataggio.crucicorretto = 1
                salvaGiocatore();
            }

            else {


                alert(

                    "❌ Ci sono " + errori + " caselle sbagliate/mancanti"

                );


            }



        }
        function mostraBottoneExtra() {

            let bottone = document.getElementById("torna-menu-extra");


            if (bottone)
                return;


            document.body.insertAdjacentHTML(
                "afterbegin",

                `
        <button 
            id="torna-menu-extra"
            class="bottone-extra"
            onclick="tornaMenuExtra()">

            ⬅ TORNA AL MENU<br>
            🔓 SBLOCCA CONTENUTI EXTRA

        </button>
        `
            );

        }
        function creaNumerazioneCruciverbone() {

            let numeri = [];

            let numero = 1;


            for (let i = 0; i < cruciverbone.soluzione.length; i++) {

                numeri[i] = [];

                for (let j = 0; j < cruciverbone.soluzione[i].length; j++) {

                    numeri[i][j] = "";

                    // se è nera salto
                    if (cruciverbone.soluzione[i][j] === "#")
                        continue;


                    let inizioOrizzontale =
                        (j === 0 || cruciverbone.soluzione[i][j - 1] === "#")
                        &&
                        (j < cruciverbone.soluzione[i].length - 1 &&
                            cruciverbone.soluzione[i][j + 1] !== "#");


                    let inizioVerticale =
                        (i === 0 || cruciverbone.soluzione[i - 1][j] === "#")
                        &&
                        (i < cruciverbone.soluzione.length - 1 &&
                            cruciverbone.soluzione[i + 1][j] !== "#");



                    if (inizioOrizzontale || inizioVerticale) {

                        numeri[i][j] = numero;

                        numero++;

                    }

                }

            }


            return numeri;

        }
        function tornaMenuExtra() {

            let bottone = document.getElementById("torna-menu-extra");

            if (bottone) {
                bottone.remove();
            }


            mostraMenu();

        }

            app.innerHTML = `

            </p>

            <h3>
                "Sono una cacca, sono una buffona!"
            </h3>

            <p>
                per ottenere il tuo premio 🎁
            </p>

            <button class="play" onclick="mostraMenu()">
                TORNA AL MENU
            </button>

        </div>

    `;

        }
        function mostraCerchiBlu() {

            cruciverbone.cerchiBlu.forEach(c => {

                let cella = document.getElementById(
                    "cella-" + c.r + "-" + c.c
                );


                if (cella) {

                    cella.classList.add("cerchio-blu");

                }

            });

        }
        function rivelaCaselleErrate() {



            // prima pulisco tutti gli errori vecchi

            document.querySelectorAll(".cella")

                .forEach(cella => {


                    cella.classList.remove("errore");


                });





            for (let i = 0; i < cruciverbone.soluzione.length; i++) {



                for (let j = 0; j < cruciverbone.soluzione[i].length; j++) {



                    let soluzione =

                        cruciverbone.soluzione[i][j];



                    if (soluzione !== "#") {



                        let inserita =

                            partitaCruciverbone.griglia[i][j];



                        if (

                            inserita !== "" &&

                            inserita !== soluzione

                        ) {



                            let cella = document.getElementById(

                                "cella-" + i + "-" + j

                            );



                            if (cella) {


                                cella.classList.add("errore");


                            }



                        }



                    }



                }



            }



        }
       
        // ==========================
// AVVIO

        avvioGiocatore();

        mostraMenu();

        aggiornaMonete();



    </script>
